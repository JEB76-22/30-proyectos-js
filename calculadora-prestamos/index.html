<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calculadora de Préstamos</title>
</head>
<body>
    <div class="container">
        <h1>Calculadora de Prestamos</h1>
        <p class="texto">Importe del prestamo $ <input onchange="calculateLoan()"  class="input" type="number" id="loan-amount" 
            min="1" max="500000" value="10000"></p>

        <p class="texto">Tasa de interes % <input onchange="calculateLoan()" class="input" type="number" id="interest-rate" 
            min="0" max="100" value="10" step=".1"></p>

        <p class="texto">Meses para pagar <input onchange="calculateLoan()" class="input" type="number" id="months-to-play" 
            min="6" max="48" value="12"></p>

        <p id="payment" class="payment">Pago Mensual:</p>
    </div>

    
    <script src="index.js"></script>
</body>
</html>
